<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T3N Governance Console</title>
<style>
body{font:16px system-ui;margin:0;background:#101522;color:#eef2ff}main{max-width:1100px;margin:auto;padding:32px}section{background:#192238;border:1px solid #30405f;border-radius:12px;padding:20px;margin:16px 0}button{background:#7dd3fc;border:0;border-radius:6px;padding:10px 14px;cursor:pointer}input{padding:10px;width:70%;border-radius:6px;border:1px solid #52627f;background:#0e1525;color:white}pre{white-space:pre-wrap;color:#c7d2fe}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}</style></head>
<body><main><h1>T3N Governance Console</h1><p>TEE-backed decisions and audit data. The browser never holds T3N keys.</p>
<section><h2>Natural-language request</h2><input id="request" placeholder="transfer 8000"><button onclick="preview()">Preview</button><pre id="decision"></pre></section>
<div class="grid"><section><h2>Pending approvals</h2><button onclick="loadApprovals()">Refresh</button><pre id="approvals"></pre></section><section><h2>Audit report</h2><button onclick="loadEvents()">Refresh</button><pre id="events"></pre></section></div>
<script>
const json=async(u,o)=>{const r=await fetch(u,o);const v=await r.json();if(!r.ok)throw Error(v.error||'request failed');return v};
async function preview(){try{const parsed=await json('/api/llm/parse',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:request.value})});decision.textContent=JSON.stringify(await json('/api/actions/preview',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(parsed)}),null,2)}catch(e){decision.textContent=e.message}}
async function loadApprovals(){approvals.textContent=JSON.stringify(await json('/api/approvals'),null,2)}
async function loadEvents(){events.textContent=JSON.stringify(await json('/api/reports/audit'),null,2)}
loadApprovals();loadEvents();
</script></main></body></html>
